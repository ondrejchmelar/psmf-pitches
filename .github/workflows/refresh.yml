name: Denní obnova výsledků

# Results appear on psmf.cz through the evening and night after each round, so
# this runs in the early morning Prague time and again in the afternoon for the
# matches that get filled in late. It only rebuilds the page; the pitches are
# measured by hand and their photos are committed.
on:
  schedule:
    - cron: "20 4 * * *"      # 06:20 Prague in summer, 05:20 in winter
    - cron: "20 13 * * *"     # and once in the afternoon
  workflow_dispatch:          # and on demand, from the Actions tab

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only what a results rebuild needs. opencv is for measuring pitches,
      # which this job never does -- build_page.py --no-images reuses the
      # committed photos and imports cv2 only when it has to write one.
      - name: Install
        run: pip install --quiet requests pyproj

      - name: Fetch results
        run: python scrape_season.py --results --pause 0.4

      - name: Rebuild the page
        run: python build_page.py --no-images

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season.json docs/
          if git diff --cached --quiet; then
            echo "no new results"
            exit 0
          fi
          scored=$(python -c 'import json;d=json.load(open("data/season.json"));print(sum(1 for t in d["teams"] for f in t["fixtures"] if f.get("score")))')
          git commit -m "Výsledky k $(date -u +%d.%m.%Y): ${scored} zápasů se skóre"
          # Someone may have pushed while this ran; rebase onto them and retry.
          git push || (git pull --rebase --autostash && git push)
