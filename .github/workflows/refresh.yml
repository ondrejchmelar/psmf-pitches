name: Denní obnova výsledků

# A score is not written once. It appears a couple of days after the match,
# unofficially, from a player -- and is then replaced by the referee's official
# result, which is not always the same number. So the morning run re-reads every
# team with a match in the last ten days whether it has a score or not, and the
# afternoon run does the cheap pass: only the teams still missing one.
#
# It only rebuilds the page. Pitches are measured by hand and their photos are
# committed, so nothing here needs opencv.
on:
  schedule:
    - cron: "20 4 * * *"      # 06:20 Prague in summer, 05:20 in winter: full pass
    - cron: "20 13 * * *"     # mid-afternoon: only what is still missing
  workflow_dispatch:          # and on demand, from the Actions tab

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only what a results rebuild needs. opencv is for measuring pitches,
      # which this job never does -- build_page.py --no-images reuses the
      # committed photos and imports cv2 only when it has to write one.
      - name: Install
        run: pip install --quiet requests pyproj

      # The afternoon run only chases matches with no score at all -- a few
      # hundred pages instead of nine hundred.
      - name: Fetch results
        run: |
          if [ "${{ github.event.schedule }}" = "20 13 * * *" ]; then
            python scrape_season.py --results --missing-only --pause 0.4
          else
            python scrape_season.py --results --pause 0.4
          fi

      - name: Rebuild the page
        run: python build_page.py --no-images

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season.json docs/
          if git diff --cached --quiet; then
            echo "no new results"
            exit 0
          fi
          scored=$(python -c 'import json;d=json.load(open("data/season.json"));print(sum(1 for t in d["teams"] for f in t["fixtures"] if f.get("score")))')
          git commit -m "Výsledky k $(date -u +%d.%m.%Y): ${scored} zápasů se skóre"
          # Someone may have pushed while this ran; rebase onto them and retry.
          git push || (git pull --rebase --autostash && git push)
